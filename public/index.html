<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Friends</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f0f4f8; }
        .splash-container {
            width: 100%;
            height: 100vh;
            background: url('splashpage.png') no-repeat center center;
            background-size: 100% 100%; /* Stretches or fits the entire graphic precisely to the screen */
            display: flex;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="splash-container" onclick="window.location.href='login.html'"></div>

    <script>
        // Automatically redirect to map/app after 3 seconds, or let user click
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 3000);
    </script>
</body>
</html>
